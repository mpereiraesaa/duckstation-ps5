[Main]
SetupWizardIncomplete = false
ConfirmPowerOff = false

[AutoUpdater]
CheckAtStartup = false

[CPU]
FastmemMode = LUT

[GPU]
Renderer = Vulkan
ResolutionScale = 6
WidescreenHack = true
TextureFilter = xBR
PGXPEnable = true
PGXPCulling = true
PGXPTextureCorrection = true
PGXPColorCorrection = true

[Display]
AspectRatio = 16:9
SkipPresentingDuplicateFrames = true

[GameList]
RecursivePaths = D:\games

[InputSources]
SDL = false
XInput = true

[Pad1]
Type = AnalogController
Up = XInput-0/DPadUp
Down = XInput-0/DPadDown
Left = XInput-0/DPadLeft
Right = XInput-0/DPadRight
Cross = XInput-0/A
Circle = XInput-0/B
Square = XInput-0/X
Triangle = XInput-0/Y
L1 = XInput-0/LeftShoulder
R1 = XInput-0/RightShoulder
L2 = XInput-0/+LeftTrigger
R2 = XInput-0/+RightTrigger
L3 = XInput-0/LeftStick
R3 = XInput-0/RightStick
Start = XInput-0/Start
Select = XInput-0/Back
LUp = XInput-0/-LeftY
LDown = XInput-0/+LeftY
LLeft = XInput-0/-LeftX
LRight = XInput-0/+LeftX
RUp = XInput-0/-RightY
RDown = XInput-0/+RightY
RLeft = XInput-0/-RightX
RRight = XInput-0/+RightX
SmallMotor = XInput-0/SmallMotor
LargeMotor = XInput-0/LargeMotor

[Hotkeys]
OpenPauseMenu = XInput-0/Guide
FastForward = XInput-0/LeftStick & XInput-0/RightStick

[TextureReplacements]
EnableTextureReplacements = true
EnableVRAMWriteReplacements = true
PreloadTextures = false
